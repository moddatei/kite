name: Kite Protocol CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Check, Test & Benchmark Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets --all-features

      - name: Run Unit & Integration Tests
        run: cargo test --all-targets --all-features --verbose

  no-std-target:
    name: Verify no_std Embedded Target (ARM Cortex-M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install embedded target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Build kite-core for Cortex-M4
        run: cargo check -p kite-core --target thumbv7em-none-eabihf --no-default-features

  security-audit:
    name: Security Audit & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
